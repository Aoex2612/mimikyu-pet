# Mimikyu Desktop Pet - Hyprland Window Rules
# Source this file in your ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/desktop-pet.conf
# Or copy the directives below directly into your windowrules section.

# Standard Hyprland (.conf) syntax:
windowrule = float, title:^(desktop-pet)$
windowrule = pin, title:^(desktop-pet)$
windowrule = noblur, title:^(desktop-pet)$
windowrule = noborder, title:^(desktop-pet)$
windowrule = noshadow, title:^(desktop-pet)$
windowrule = noanim, title:^(desktop-pet)$
windowrule = noinitialfocus, title:^(desktop-pet)$

# Hyprland 0.57+ / Lua syntax (e.g. hyprland.lua / hypr-user.lua):
# hl.window_rule({
#     name             = "desktop-pet",
#     match            = { title = "desktop-pet" },
#     float            = true,
#     no_blur          = true,
#     pin              = true,
#     border_size      = 0,
#     no_shadow        = true,
#     no_glow          = true,
#     no_anim          = true,
#     no_wobble        = true,
#     no_initial_focus = true,
# })
